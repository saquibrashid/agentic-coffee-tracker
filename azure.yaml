# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: agentic-coffee-tracker
metadata:
  template: agentic-coffee-tracker@1.0.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  # `project: .` (not ./api) so azd restores through the root pnpm workspace —
  # ./api has no lockfile of its own, which made azd fall back to npm and walk
  # into pnpm's symlinked store. `dist` points at the staged Function zip root.
  api:
    project: .
    language: js
    host: function
    dist: api/deploy
    # The staged package already vendors its production dependencies from the
    # local pnpm store, so there is nothing for a remote npm install to do.
    remoteBuild: false
    hooks:
      prepackage:
        windows:
          shell: pwsh
          run: pnpm --filter ./api run build; pnpm --filter ./api run package
          interactive: false
          continueOnError: false
        posix:
          shell: sh
          run: pnpm --filter ./api run build && pnpm --filter ./api run package
          interactive: false
          continueOnError: false

  web:
    project: .
    language: js
    host: staticwebapp
    dist: dist

hooks:
  prepackage:
    windows:
      shell: pwsh
      run: pnpm install --frozen-lockfile
      interactive: false
      continueOnError: false
    posix:
      shell: sh
      run: pnpm install --frozen-lockfile
      interactive: false
      continueOnError: false
