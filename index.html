<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f2" />
    <meta name="description" content="Offline-first, AI-powered coffee tracking." />
    <title>Agentic Coffee Tracker</title>
    <!--
      Applies the theme before the first paint. This has to be inline and
      synchronous: a deferred module would run after the browser has already
      painted, so a dark-mode user would see a white flash on every load.

      Deliberately duplicates a few lines of src/services/theme/theme.ts. An
      import would defeat the purpose, and the duplicated logic is guarded by
      the "matches the pre-paint script" tests in theme.test.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('coffee-app.theme');
          var pref =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#2b1f16' : '#faf7f2');
        } catch (e) {
          /* Storage blocked or matchMedia missing: fall through to light. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
