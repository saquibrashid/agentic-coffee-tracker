name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC federated credentials — no long-lived cloud secrets in the repo.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: azd up (dev)
    runs-on: ubuntu-latest
    environment: dev
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME || 'coffee-dev' }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
      STATIC_WEB_APP_SKU: ${{ vars.STATIC_WEB_APP_SKU || 'Free' }}
      # Who may sync. Defaults to closed: with no SYNC_ALLOWLIST the endpoints
      # reject every account, including the owner's, because authentication
      # alone is not a restriction — Microsoft accounts are free and unlimited.
      # Sign in, open /.auth/me, and put the userId in the SYNC_ALLOWLIST
      # repository variable. See docs/deployment.md.
      SYNC_ACCESS_MODE: ${{ vars.SYNC_ACCESS_MODE || 'owner' }}
      SYNC_ALLOWLIST: ${{ vars.SYNC_ALLOWLIST }}
      # Optional ceiling on records per user. Unset uses the API's 20,000
      # default; the empty string here would too, but naming it means raising
      # the cap is a repository-variable change rather than a code change.
      SYNC_RECORD_QUOTA: ${{ vars.SYNC_RECORD_QUOTA || '20000' }}
      AZURE_VISION_ENDPOINT: ${{ vars.AZURE_VISION_ENDPOINT }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
      # Studio photo generation is billed per image, so it stays off unless one
      # of these is set: the app falls back to echoing the source photo back.
      AZURE_IMAGE_ENDPOINT: ${{ vars.AZURE_IMAGE_ENDPOINT }}
      AZURE_IMAGE_DEPLOYMENT: ${{ vars.AZURE_IMAGE_DEPLOYMENT }}
      AZURE_IMAGE_MODEL: ${{ vars.AZURE_IMAGE_MODEL }}
      AZURE_IMAGE_KEY: ${{ secrets.AZURE_IMAGE_KEY }}
      AZURE_VISION_KEY: ${{ secrets.AZURE_VISION_KEY }}
      AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
    steps:
      - uses: actions/checkout@v7

      # Forks have no subscription, so they skip the deploy and stay green out of
      # the box. This repo is expected to be configured, so a missing variable is
      # a real breakage and fails the run — a green check here must mean the
      # commit actually shipped, never that the deploy was quietly bypassed.
      - name: Check Azure configuration
        id: config
        env:
          IS_FORK: ${{ github.event.repository.fork }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ] && [ -n "$AZURE_TENANT_ID" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$IS_FORK" = "true" ]; then
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::notice title=Deploy skipped on fork::This fork has no Azure subscription wired up, so nothing was deployed. That is expected."
            {
              echo "## ⏭️ Deploy skipped — this is a fork"
              echo ""
              echo "Forks have no Azure subscription, so \`azd provision\` and \`azd deploy\` were not run."
              echo "To deploy your own copy, see [docs/deployment.md](../blob/main/docs/deployment.md)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "ready=false" >> $GITHUB_OUTPUT
          echo "::error title=Deploy failed — nothing was published::Azure repository variables are missing, so this commit did NOT deploy. The live site still serves the previous build. Restore the variables with 'azd pipeline config --provider github', or publish by hand with 'azd deploy'. See docs/deployment.md."
          {
            echo "## ❌ Deploy failed — nothing was published"
            echo ""
            echo "One or more of \`AZURE_CLIENT_ID\` / \`AZURE_TENANT_ID\` / \`AZURE_SUBSCRIPTION_ID\` is missing from the"
            echo "repository variables, so \`azd provision\` and \`azd deploy\` never ran."
            echo "**The live site is still serving the previous build.**"
            echo ""
            echo "| Variable | Set |"
            echo "| --- | --- |"
            echo "| \`AZURE_CLIENT_ID\` | $([ -n "$AZURE_CLIENT_ID" ] && echo 'yes' || echo '**no**') |"
            echo "| \`AZURE_TENANT_ID\` | $([ -n "$AZURE_TENANT_ID" ] && echo 'yes' || echo '**no**') |"
            echo "| \`AZURE_SUBSCRIPTION_ID\` | $([ -n "$AZURE_SUBSCRIPTION_ID" ] && echo 'yes' || echo '**no**') |"
            echo ""
            echo "To restore them: \`azd pipeline config --provider github\`"
            echo ""
            echo "To publish right now from your machine: \`azd deploy\`"
            echo ""
            echo "See [docs/deployment.md](../blob/main/docs/deployment.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Setup pnpm
        if: steps.config.outputs.ready == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install azd
        if: steps.config.outputs.ready == 'true'
        uses: Azure/setup-azd@v2

      - name: Log in with federated credentials
        if: steps.config.outputs.ready == 'true'
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider github \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision infrastructure
        if: steps.config.outputs.ready == 'true'
        run: azd provision --no-prompt

      - name: Deploy the API
        if: steps.config.outputs.ready == 'true'
        run: azd deploy api --no-prompt

      # The web bundle is built and uploaded here rather than by `azd deploy web`.
      #
      # azd publishes a `staticwebapp` service by shelling out to
      # `npx @azure/static-web-apps-cli`, which resolves a fresh dependency tree
      # from the registry on every run with no lockfile to pin it. On 2026-08-19
      # a broken `@azure/identity` release — it declared a dependency on a
      # package that was never published — made that install fail and blocked
      # every deploy for hours, with nothing wrong in this repository (#234).
      #
      # The official action ships its tooling inside a container, so publishing
      # no longer depends on the npm registry being healthy at that moment. Our
      # own build still installs from the lockfile, which is why it was never
      # affected.
      - name: Build the web bundle
        if: steps.config.outputs.ready == 'true'
        run: |
          # Both are infrastructure outputs rather than hand-set values: the
          # topology decides them, so reading them back from the environment
          # that was just provisioned is what keeps the bundle honest about
          # which API it talks to and whether sign-in can be trusted.
          VITE_API_BASE_URL=$(azd env get-value VITE_API_BASE_URL 2>/dev/null || echo '')
          VITE_AUTH_ENABLED=$(azd env get-value VITE_AUTH_ENABLED 2>/dev/null || echo 'false')
          export VITE_API_BASE_URL VITE_AUTH_ENABLED
          echo "Building with VITE_AUTH_ENABLED=$VITE_AUTH_ENABLED and API base '${VITE_API_BASE_URL:-<linked backend>}'"
          pnpm build

      - name: Log in to the Azure CLI
        if: steps.config.outputs.ready == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read the Static Web App deployment token
        id: swa
        if: steps.config.outputs.ready == 'true'
        run: |
          SWA_NAME=$(azd env get-value SERVICE_WEB_NAME)
          RESOURCE_GROUP=$(azd env get-value AZURE_RESOURCE_GROUP)
          TOKEN=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.apiKey" -o tsv)
          if [ -z "$TOKEN" ]; then
            echo "::error title=Deploy failed — nothing was published::Could not read the deployment token for $SWA_NAME."
            exit 1
          fi
          # Masked before it is written anywhere: this token on its own is
          # enough to publish to the live site.
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Publish the web bundle
        if: steps.config.outputs.ready == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          # Already built above, and the API is a separate linked Function App,
          # so there is nothing here for the action's own build to do.
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      # Confirms the BFF is reachable and reports whether each integration is
      # running live or in mock mode.
      - name: Smoke test /api/health
        if: steps.config.outputs.ready == 'true'
        run: |
          # Probe the Static Web App, not the Function App: the linked backend
          # enables Easy Auth on the Function App so its own hostname 401s.
          API_URI=$(azd env get-value SERVICE_WEB_URI)
          echo "Probing $API_URI/api/health"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 "$API_URI/api/health" -o health.json; then
              cat health.json
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "::error::Health probe never returned 200."
          exit 1

      - name: Report published build
        if: steps.config.outputs.ready == 'true'
        run: |
          WEB_URI=$(azd env get-value SERVICE_WEB_URI)
          {
            echo "## ✅ Deployed"
            echo ""
            echo "Commit \`${GITHUB_SHA::7}\` is live at $WEB_URI"
          } >> "$GITHUB_STEP_SUMMARY"
