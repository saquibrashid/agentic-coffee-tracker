name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Spec-only PRs still need to validate markdown.
  docs:
    name: Docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            !node_modules

  # Catches Bicep syntax/type errors on PRs without needing a subscription.
  infra:
    name: Infra lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Bicep templates
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --outfile /tmp/main.json
      - name: Fail on Bicep linter warnings
        run: |
          output=$(az bicep build --file infra/main.bicep --outfile /tmp/main.json 2>&1 || true)
          echo "$output"
          if echo "$output" | grep -q "infra/.*: Warning"; then
            echo "::error::Bicep linter reported warnings."
            exit 1
          fi

  # The full build job is gated on the project being scaffolded.
  # Until package.json exists at the repo root, this job is skipped automatically.
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - uses: actions/checkout@v7

      - name: Detect project scaffold
        id: scaffold
        run: |
          if [ -f package.json ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::notice::No package.json yet — skipping build/test. Scaffold the project to enable this step."
          fi

      - name: Setup pnpm
        if: steps.scaffold.outputs.ready == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node
        if: steps.scaffold.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm lint

      - name: Format check
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm format:check

      - name: Typecheck
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm typecheck

      - name: Unit & component tests
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm test -- --coverage

      - name: Build
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm build

      - name: Install Playwright browsers
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm exec playwright install --with-deps

      - name: Playwright e2e (smoke + a11y)
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm test:e2e

      # Separate config, separate dev server: the two-device sync test needs
      # VITE_AUTH_ENABLED set, which would change the conditions every test
      # above runs under. `specs/sync.md` -> Testing calls this the test that
      # actually proves the feature, so it is a required check, not optional.
      - name: Playwright e2e (two-device sync)
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm test:e2e:sync

      # Runs a production build under the exact policy it ships with. The suite
      # above uses the dev server, which necessarily serves a laxer policy — a
      # browser ignores 'unsafe-inline' once a hash is present, so dev cannot
      # stand in for production here. A wrong CSP breaks features silently, so
      # this is a required check.
      - name: Playwright e2e (content security policy)
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm test:e2e:csp

      - name: Upload Playwright report
        if: always() && steps.scaffold.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Performance / a11y / PWA budgets. Fails the PR when a change regresses the
  # thresholds in lighthouserc.json.
  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Start preview server
        run: |
          pnpm exec vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:4173/ > /dev/null; then
              echo "Preview server is up."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Preview server never became ready."
          cat preview.log
          exit 1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          temporaryPublicStorage: true
